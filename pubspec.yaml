name: cynora_focus
description: "Study Cafe: Pomodoro Timer - gamified focus and study timer with a virtual cafe."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  flutter_riverpod: ^3.0.0
  
  path_provider: ^2.1.2
  
  firebase_core: ^5.0.0
  firebase_crashlytics: ^6.0.0
  firebase_analytics: ^13.0.0
  firebase_remote_config: ^7.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  
  vibration: ^3.1.3
  audioplayers: ^6.0.0
  
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  
  flutter_secure_storage: ^11.2.0
  flutter_native_splash: ^2.4.0
  
  share_plus: ^13.3.1
  url_launcher: ^6.3.0
  
  google_mobile_ads: ^9.1.0
  isar_community: 3.3.0
  isar_community_flutter_libs: 3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  isar_community_generator: 3.3.0

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/sounds/
