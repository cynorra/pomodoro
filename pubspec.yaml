name: cynora_focus
description: "Cynora Focus: Gamified Pomodoro & Virtual Study Cafe"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  flutter_riverpod: ^2.5.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2
  
  firebase_core: ^3.3.0
  firebase_crashlytics: ^4.0.4
  firebase_analytics: ^11.2.1
  firebase_remote_config: ^5.0.4
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.0
  
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  
  vibration: ^3.1.3
  audioplayers: ^6.0.0
  
  flutter_local_notifications: ^17.2.1
  permission_handler: ^11.3.1
  timezone: ^0.9.3
  
  flutter_secure_storage: ^9.0.0
  flutter_native_splash: ^2.4.0
  
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  isar_generator: ^3.1.0+1

flutter:
  generate: true
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/sounds/
